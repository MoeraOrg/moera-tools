[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "moera-tools"
version = "0.7.0"
authors = [
    {name = "Shmuel Leib Melamud", email = "balu@moera.org"},
]
description = "Tools for Moera administrators"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["Moera", "tools", "naming", "node", "administration", "provider"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: System Administrators",
    "Topic :: Utilities"
]
dependencies = [
    "moeralib==0.19.1",
    "python-dateutil>=2.9.0",
    "PyYAML>=6.0.3",
    "first>=2.0.2",
    "docopt>=0.6.2",
    "urllib3>=2.7.0",
]

[project.scripts]
moname = "moname.moname:moname"
moctl = "moctl.moctl:moctl"

[project.urls]
"Homepage" = "https://github.com/MoeraOrg/moera-tools"
"Bug Tracker" = "https://github.com/MoeraOrg/moera-issues/issues"
"Overview" = "https://moera.org"

[tool.uv.sources]
moeralib = { path = "../python-moeralib", editable = true }
